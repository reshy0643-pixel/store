<header><div class="hw"><div class="lg" id="lg"></div><div><div class="bn" id="hd"></div><div class="bs" id="hs"></div></div><div class="hr"><button class="ib" id="ins" hidden onclick="doInstall()">تثبيت البرنامج</button><span class="sy" id="sy" hidden></span><div class="ub" id="ub" hidden><button class="sb" id="secb" onclick="toggleSec()"></button><span class="nm" id="un" onclick="myPw()" title="تغيير كلمة السر"></span><button onclick="logout()">خروج</button></div></div></div></header>

<script>
'use strict';
/* =====================================================================
   البيانات
   ===================================================================== */
const K='store_system_v1';
const COLS=['p','s','c','y','e','u','us','q','r','sup','sp','adj','log'];
const CNT={n:'s',i:'p',ci:'c',yi:'y',ei:'e',ui:'u',usi:'us',qi:'q',ri:'r',supi:'sup',spi:'sp',adji:'adj'};
const SET={name:'دار العطور',nameEn:'',tag:'لتصدير العطور ومستحضرات التجميل',phone:'',addr:'',addrEn:'',reg:'',cur:'د.ل',
 fx:[{c:'$',r:4.85},{c:'€',r:5.25}],bi:false,logo:'',low:5,expDays:90,cc:'218',foot:'شكراً لثقتكم',paper:'80',lockMin:10};
const CATS=['عطور','مكياج','عناية بالبشرة','عناية بالشعر','أطقم هدايا','زيوت وبخور'];
function fix(x){
 x=x&&typeof x=='object'?x:{};
 COLS.forEach(k=>{if(!Array.isArray(x[k]))x[k]=[]});
 x.set=Object.assign({},SET,x.set||{});if(!Array.isArray(x.set.fx))x.set.fx=[];
 const mx=a=>a.reduce((r,o)=>Math.max(r,+o.id||0),0)+1;
 for(const k in CNT)x[k]=Math.max(+x[k]||1,mx(x[CNT[k]]));
 x.s.forEach(s=>{if(s.paid==null){s.paid=s.total;s.due=0;s.pay='cash'}if(s.cid===undefined)s.cid=null;if(s.disc==null)s.disc=0;
  if(!s.cur){s.cur=x.set.cur;s.rate=1}s.items.forEach(i=>{if(i.rq==null)i.rq=0;if(!Array.isArray(i.lots))i.lots=[]})});
 x.p.forEach(p=>{if(!Array.isArray(p.lots))p.lots=[]});
 x.c.forEach(c=>{if(!c.prices||typeof c.prices!='object')c.prices={}});
 x.u.forEach(u=>{if(u.paid==null)u.paid=u.qty*u.cost;
  if(!u.supId&&u.sup){let s=x.sup.find(z=>z.name==u.sup);if(!s){s={id:x.supi++,name:u.sup,phone:'',country:''};x.sup.push(s)}u.supId=s.id}});
 return x}
let D;try{D=fix(JSON.parse(localStorage.getItem(K)||'null'))}catch(e){D=fix(null)}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){alert('تعذّر الحفظ في المتصفح. حمّل نسخة احتياطية الآن.')}syncMark()}

/* =====================================================================
   أدوات عامة
   ===================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f2=n=>(+n||0).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=n=>Math.round((+n||0)*100)/100;
const ld=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const now=()=>new Date().toTimeString().slice(0,5);
const addDays=(n,d=new Date())=>{const x=new Date(d);x.setDate(x.getDate()+n);return ld(x)};
const daysTo=s=>Math.round((new Date(s+'T00:00:00')-new Date(ld()+'T00:00:00'))/864e5);
let C='د.ل';
const S=()=>D.set;
const sm=(a,f)=>a.reduce((r,x)=>r+(+f(x)||0),0);
const inR=(d,a,b)=>d>=a&&d<=b;
const LOW=()=>+S().low||0;
const pname=p=>p.name+(p.size?' '+p.size:'');
const prod=id=>D.p.find(x=>x.id==id);
const cust=id=>D.c.find(x=>x.id==id);
const supp=id=>D.sup.find(x=>x.id==id);
const cname=id=>{const c=cust(id);return c?c.name:'زبون نقدي'};
const retCredit=id=>sm(D.r.filter(r=>r.cid==id&&r.refund=='credit'),r=>r.amt);
const bal=id=>r2(sm(D.s.filter(s=>s.cid==id),s=>s.due)-sm(D.y.filter(y=>y.cid==id),y=>y.amt)-retCredit(id));
const supBal=id=>r2(sm(D.u.filter(u=>u.supId==id),u=>u.qty*u.cost-(u.paid||0))-sm(D.sp.filter(x=>x.supId==id),x=>x.amt));
const PAY={cash:'مدفوع',partial:'دفع جزئي',credit:'آجل'};
const METH={cash:'نقداً',card:'بطاقة مصرفية',transfer:'حوالة مصرفية'};
const METH_EN={cash:'Cash',card:'Bank card',transfer:'Bank transfer'};
const payLabel=s=>s.due>0?(s.paid>0?'جزئي ('+METH[s.pm||'cash']+') + آجل':'آجل'):METH[s.pm||'cash'];
const pcats=()=>[...new Set([...CATS,...D.p.map(p=>p.cat).filter(Boolean)])];
const catOpts=()=>'<option value="">كل التصنيفات</option>'+pcats().map(c=>`<option>${esc(c)}</option>`).join('');
const curs=()=>[S().cur,...S().fx.map(x=>x.c).filter(c=>c&&c!=S().cur)];
const rateOf=c=>c==S().cur?1:(+((S().fx.find(x=>x.c==c)||{}).r)||1);
const curOpts=sel=>curs().map(c=>`<option ${c==sel?'selected':''}>${esc(c)}</option>`).join('');
const L=(a,e)=>S().bi&&e?`${a} <span class="en">/ ${e}</span>`:a;
const LT=(a,e)=>S().bi&&e?a+' / '+e:a;
function log(a,x=''){D.log.push({t:ld()+' '+now(),by:actor(),sec:SEC=='admin'?'إدارة':'مبيعات',a,x:String(x).slice(0,300)});if(D.log.length>3000)D.log.splice(0,D.log.length-3000)}

/* ===== الدُفعات والصلاحية (الأقرب انتهاءً يُباع أولاً) ===== */
const lotsSum=p=>sm(p.lots||[],l=>l.q);
const byExp=(a,b)=>(a.exp||'9999').localeCompare(b.exp||'9999');
function takeLots(p,q){ // يُستدعى قبل خصم المخزون
 p.lots=(p.lots||[]).filter(l=>l.q>0).sort(byExp);
 const free=Math.max(0,p.stock-lotsSum(p));q-=Math.min(free,q);
 const used=[];for(const l of p.lots){if(q<=0)break;const t=Math.min(l.q,q);l.q=r2(l.q-t);q=r2(q-t);used.push({b:l.b||'',exp:l.exp||'',q:t})}
 p.lots=p.lots.filter(l=>l.q>0);return used}
function takeLot(p,lot,q){const l=(p.lots||[]).find(x=>(x.b||'')==(lot.b||'')&&(x.exp||'')==(lot.exp||''));if(!l)return [];const t=Math.min(l.q,q);l.q=r2(l.q-t);p.lots=p.lots.filter(x=>x.q>0);return t?[{b:l.b||'',exp:l.exp||'',q:t}]:[]}
function putLots(p,used){(used||[]).forEach(u=>{if(!u.q)return;const l=(p.lots||(p.lots=[])).find(x=>(x.b||'')==(u.b||'')&&(x.exp||'')==(u.exp||''));if(l)l.q=r2(l.q+u.q);else p.lots.push({b:u.b||'',exp:u.exp||'',q:u.q})})}
function normLots(p){let ex=r2(lotsSum(p)-Math.max(0,p.stock));if(ex<=0)return;p.lots.sort((a,b)=>byExp(b,a));for(const l of p.lots){if(ex<=0)break;const t=Math.min(l.q,ex);l.q=r2(l.q-t);ex=r2(ex-t)}p.lots=p.lots.filter(l=>l.q>0)}
const nearExp=p=>((p.lots||[]).filter(l=>l.exp&&l.q>0).sort(byExp)[0]||{}).exp||'';
function allLots(){const o=[];D.p.forEach(p=>(p.lots||[]).forEach(l=>{if(l.exp&&l.q>0)o.push({p,l,d:daysTo(l.exp)})}));return o.sort((a,b)=>a.d-b.d)}

/* =====================================================================
   المستخدمين وتسجيل الدخول
   ===================================================================== */
const SK='store_session';
const ROLE={admin:'مدير',cashier:'بائع'};
const SALES_TABS=['sell','quotes','sales','cust','acct'];
const ADMIN_TABS=['home','inv','prod','stock','buy','sup','cust','acct','exp','rep','log','set'];
let ME=null,MGR=null,SEC='sales',FAIL=0,LOCK=0,LAST_ACT=Date.now();
const isA=()=>SEC=='admin'&&!!MGR;            // داخل قسم الإدارة (بعد إدخال بيانات المدير)
const okTab=t=>(isA()?ADMIN_TABS:SALES_TABS).includes(t);
const need=()=>{if(isA())return true;alert('هذه العملية من قسم الإدارة فقط');return false};
const actor=()=>isA()?MGR.name:(ME?ME.name:'-');
function sha256js(str){
 const b=[...new TextEncoder().encode(str)],l=b.length*8;b.push(0x80);while(b.length%64!=56)b.push(0);
 for(let i=7;i>=0;i--)b.push(Math.floor(l/2**(8*i))&255);
 const K=[],H=[],fr=x=>(x-Math.floor(x))*4294967296|0;let n=2,c=0;
 while(c<64){let p=1;for(let i=2;i*i<=n;i++)if(n%i==0){p=0;break}if(p){if(c<8)H[c]=fr(n**.5);K[c++]=fr(Math.cbrt(n))}n++}
 const r=(x,y)=>(x>>>y)|(x<<(32-y));
 for(let o=0;o<b.length;o+=64){
  const w=[];for(let i=0;i<16;i++)w[i]=(b[o+4*i]<<24)|(b[o+4*i+1]<<16)|(b[o+4*i+2]<<8)|b[o+4*i+3];
  for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
  let [a,bb,cc,d,e,f,g,h]=H;

function delC(id){

 ov.innerHTML=`<div class="card"><h3>تسديد من ${esc(cname(id))}</h3><p class="k">الرصيد الحالي: <b>${f2(b)} ${esc(C)}</b></p>

function savePay(id){
 const a=+$('#ya').value,b=bal(id);if(!(a>0))return alert('اكتب المبلغ');
 if(a>b&&!confirm('المبلغ أكبر من الدين، الفرق يصبح رصيداً للزبون. متابعة؟'))return;
 const pm=$('#ym').value,y={id:D.yi++,cid:id,d:ld(),t:now(),amt:a,pm,ref:pm=='cash'?'':$('#yr').value.trim(),note:$('#yn').value.trim(),by:actor()};
 document.querySelector('.ov').remove();
 D.y.push(y);log('تسديد زبون',cname(id)+' · '+f2(a)+' · '+METH[pm]);save();if(tab=='acct')drawAcct();else go(tab);
 if(confirm('تم تسجيل التسديد ✔\nطباعة إيصال؟'))printPay(y.id)}
function printPay(yid){
 const y=D.y.find(x=>x.id==yid);if(!y)return;
 const t=[S().name,'إيصال استلام رقم: '+y.id,'التاريخ: '+y.d+' '+y.t,'استلمنا من: '+cname(y.cid),'المبلغ: '+f2(y.amt)+' '+C,'طريقة الدفع: '+METH[y.pm||'cash'],'الرصيد المتبقي: '+f2(bal(y.cid))+' '+C].join('\n');
 doPrint(shopHead()+`<div class="tt">${L('إيصال استلام','Receipt')} ${y.id}</div><div>${L('التاريخ','Date')}: ${y.d} ${y.t}<br>${L('استلمنا من','Received from')}: <b>${esc(cname(y.cid))}</b><br>${L('المبلغ','Amount')}: <b>${f2(y.amt)} ${esc(C)}</b><br>${L('طريقة الدفع','Method')}: ${L(METH[y.pm||'cash'],METH_EN[y.pm||'cash'])}${y.ref?' · '+esc(y.ref):''}${y.note?'<br>'+esc(y.note):''}<br>${L('الرصيد المتبقي','Balance')}: ${f2(bal(y.cid))} ${esc(C)}</div><div class="c qr">${qrSvg(t)}</div><div class="c">${esc(S().foot)}</div>`)}
function waBal(id){const c=cust(id);wa(c.phone,`${S().name}\nالسيد/ة ${c.name} (رقم ${c.id})\nرصيد حسابكم لدينا حتى ${ld()}: ${f2(bal(id))} ${C}\nشكراً لتعاملكم معنا`)}
function wa(phone,text){
 let d=String(phone||'').replace(/\D/g,'');
 if(!d){d=(prompt('رقم واتساب (مع رمز الدولة أو بدونه):')||'').replace(/\D/g,'');if(!d)return}
 if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d=(S().cc||'218')+d.slice(1);
 window.open('https://wa.me/'+d+'?text='+encodeURIComponent(text),'_blank')}

function stmtRows(id){
 const ev=[...D.s.filter(s=>s.cid==id).map(s=>({d:s.d,t:s.t,k:'s',o:s,dr:s.total,cr:s.paid})),
  ...D.y.filter(y=>y.cid==id).map(y=>({d:y.d,t:y.t,k:'y',o:y,dr:0,cr:y.amt})),
  ...D.r.filter(r=>r.cid==id).map(r=>({d:r.d,t:r.t,k:'r',o:r,dr:0,cr:r.refund=='credit'?r.amt:0}))].sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t));
 let run=0;ev.forEach(e=>{run=r2(run+e.dr-e.cr);e.run=run});return ev}

 r.map(c=>`<div class="pi" onclick="ACID=${c.id};$('#aq').value='';$('#ar').innerHTML='';drawAcct()"><span><b>${esc(c.name)}</b> <span class="k">رقم ${c.id}${c.phone?' · '+esc(c.phone):''}</span></span><span class="${bal(c.id)>0?'neg':'k'}">${f2(bal(c.id))}</span></div>`).join('')+(q.trim()&&!r.length?'<p class="k">لا يوجد زبون بهذا الاسم أو الرقم</p>':'')}
function acctData(id){
 const a=$('#aa').value||'0000-00-00',b=$('#ab').value||'9999-12-31',all=stmtRows(id);
 const before=all.filter(e=>e.d<a),ev=all.filter(e=>inR(e.d,a,b));
 const open=before.length?before[before.length-1].run:0;
 const inv=ev.filter(e=>e.k=='s').map(e=>e.o),pay=ev.filter(e=>e.k=='y').map(e=>e.o),ret=ev.filter(e=>e.k=='r').map(e=>e.o);
 const tp={};inv.forEach(s=>s.items.forEach(i=>{const o=tp[i.name]||(tp[i.name]={q:0,v:0});o.q+=i.qty-i.rq;o.v+=i.price*(i.qty-i.rq)}));
 return{a:$('#aa').value,b,ev,open,close:ev.length?ev[ev.length-1].run:open,inv,pay,ret,top:Object.entries(tp).filter(x=>x[1].q>0).sort((x,y)=>y[1].v-x[1].v)}}
const itemsTxt=s=>s.items.map(i=>`${esc(i.name)} ×${i.qty} × ${f2(i.price)}${i.rq?' (مرتجع '+i.rq+')':''}`).join('<br>')+(s.disc?'<br>خصم: '+f2(s.disc):'');
const evLabel=e=>e.k=='s'?'فاتورة رقم '+e.o.id:e.k=='y'?'تسديد':'مرتجع من فاتورة '+e.o.sid+(e.o.refund=='cash'?' (أُرجع نقداً '+f2(e.o.amt)+')':'');

 const id=ACID,c=cust(id);if(!c){$('#ao').innerHTML='';return}
 const x=acctData(id),showI=$('#ait').checked,A=isA();
 $('#ao').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between">
 <div><h3 style="margin:0">${esc(c.name)}</h3><span class="k">رقم الزبون: ${c.id}${c.phone?' · هاتف: '+esc(c.phone):''}${c.country?' · '+esc(c.country):''} · الفترة: ${x.a||'من البداية'} إلى ${x.b}</span></div>
 <div class="row"><button class="b" style="padding:6px 14px" onclick="payC(${id})">تسجيل تسديد</button><button class="b s" onclick="printAcct()">طباعة الكشف</button><button class="b s" onclick="waAcct()">واتساب</button></div></div></div>
 <div class="g">${box('عدد الفواتير',x.inv.length)}${box('إجمالي المشتريات',f2(sm(x.inv,s=>s.total))+' '+C)}${box('المدفوع عند الشراء',f2(sm(x.inv,s=>s.paid))+' '+C)}
 ${box('التسديدات',f2(sm(x.pay,y=>y.amt))+' '+C)}${x.ret.length?box('المرتجعات',f2(sm(x.ret,r=>r.amt))+' '+C):''}${x.a?box('الرصيد قبل الفترة',f2(x.open)+' '+C):''}${box('الرصيد المستحق',f2(x.close)+' '+C,x.close>0?'neg':'pos')}</div>
 <div class="card tw"><h3>الحركات</h3><table><tr><th>التاريخ</th><th>البيان</th>${showI?'<th>الأصناف</th>':''}<th>عليه</th><th>له / دفع</th><th>الرصيد</th><th></th></tr>
 ${x.a?`<tr><td>${x.a}</td><td>رصيد سابق</td>${showI?'<td></td>':''}<td></td><td></td><td>${f2(x.open)}</td><td></td></tr>`:''}
 ${x.ev.map(e=>`<tr><td>${e.d}<br><span class="k">${e.t}</span></td><td>${evLabel(e)}${e.k=='s'?'<br><span class="k">'+payLabel(e.o)+'</span>':''}${e.k=='y'?'<br><span class="k">'+METH[e.o.pm||'cash']+(e.o.ref?' · '+esc(e.o.ref):'')+(e.o.note?' · '+esc(e.o.note):'')+'</span>':''}</td>
 ${showI?`<td class="it">${e.k=='s'?itemsTxt(e.o):e.k=='r'?e.o.items.map(i=>esc(i.name)+' ×'+i.qty).join('<br>'):''}</td>`:''}<td>${e.dr?f2(e.dr):''}</td><td>${e.cr?f2(e.cr):''}</td><td><b>${f2(e.run)}</b></td>
 <td>${e.k=='s'?`<button class="b s" onclick="printInv(${e.o.id})">فاتورة</button>`:e.k=='y'?`<button class="b s" onclick="printPay(${e.o.id})">إيصال</button>${A?` <button class="b d" onclick="delY(${e.o.id})">حذف</button>`:''}`:`<button class="b s" onclick="printRet(${e.o.id})">إيصال</button>`}</td></tr>`).join('')}</table>
 ${x.ev.length?'':'<p class="k">لا توجد حركات في هذه الفترة</p>'}</div>
 ${x.top.length?`<div class="card tw"><h3>الأصناف التي اشتراها</h3><table><tr><th>الصنف</th><th>الكمية</th><th>القيمة</th></tr>${x.top.map(([n,o])=>`<tr><td>${esc(n)}</td><td>${o.q}</td><td>${f2(o.v)}</td></tr>`).join('')}</table></div>`:''}`}

function waAcct(){const c=cust(ACID);if(!c)return;const x=acctData(ACID);

 D.u=D.u.filter(x=>x.id!=id);log('حذف توريد',u.name+' ×'+u.qty);save();drawBuy()}

const ADJ=['تالف','عينات (Tester)','هدية','فقد','منتهي الصلاحية','زيادة جرد'];
function applyAdj(p,type,delta,note,lot){
 if(!delta)return;let lots=[];
 if(delta<0)lots=lot?takeLot(p,lot,-delta):takeLots(p,-delta);else if(lot){putLots(p,[{...lot,q:delta}]);lots=[{...lot,q:delta}]}
 p.stock=r2(p.stock+delta);normLots(p);
 D.adj.push({id:D.adji++,pid:p.id,name:pname(p),d:ld(),t:now(),type,qty:delta,cost:p.cost,note:note||'',by:actor(),lots});
 log('تسوية مخزون',pname(p)+' · '+type+' · '+(delta>0?'+':'')+delta)}

 m.innerHTML=`<div class="card tw"><h3>الصلاحية حسب الدفعات</h3><p class="k">المنتجات اللي صلاحيتها أقرب تنباع أولاً تلقائياً. التنبيه قبل ${ed} يوم (تقدر تغيّرها من الإعدادات).</p>
 <table><tr><th>المنتج</th><th>التشغيلة</th><th>الكمية</th><th>تاريخ الصلاحية</th><th>المتبقي</th><th></th></tr>
 ${lots.map(x=>`<tr class="${x.d<0?'bad':x.d<=ed?'low':''}"><td>${esc(pname(x.p))}</td><td dir="ltr">${esc(x.l.b||'-')}</td><td>${x.l.q}</td><td>${x.l.exp}</td><td>${x.d<0?'<b class="neg">منتهي منذ '+(-x.d)+' يوم</b>':x.d+' يوم'}</td>
 <td><button class="b d" onclick="killLot(${x.p.id},'${esc(x.l.b||'')}','${x.l.exp}')">إتلاف الدفعة</button></td></tr>`).join('')||'<tr><td colspan="6">لا توجد دفعات بتاريخ صلاحية. سجّل الصلاحية عند التوريد.</td></tr>'}</table></div>
 <div class="card"><h3>تسوية مخزون (تالف، عينات، هدايا...)</h3>${D.p.length?`<div class="f">
 <div><label>المنتج</label><select id="ap">${D.p.map(p=>`<option value="${p.id}">${esc(pname(p))} (${p.stock})</option>`).join('')}</select></div>

 <div class="card tw"><h3>جرد شامل</h3><p class="k">اكتب الكمية الفعلية الموجودة على الرف. الفرق يتسجل تلقائياً كتسوية جرد. اترك الخانة فارغة لو ما جرّدتش الصنف.</p>
 <input id="jq" placeholder="بحث" oninput="drawCount()" style="margin-bottom:8px"><div id="jt"></div><button class="b" style="margin-top:10px" onclick="saveCount()">حفظ الجرد</button></div>

const CNTV={};
function drawCount(){const q=($('#jq').value||'').trim().toLowerCase();
 $('#jt').innerHTML='<table><tr><th>المنتج</th><th>الباركود</th><th>بالنظام</th><th>الفعلي</th><th>الفرق</th></tr>'+D.p.filter(p=>!q||pname(p).toLowerCase().includes(q)||(p.code||'').includes(q)).map(p=>`<tr><td>${esc(pname(p))}</td><td dir="ltr">${esc(p.code)}</td><td>${p.stock}</td><td><input type="number" min="0" step="any" value="${CNTV[p.id]??''}" oninput="CNTV[${p.id}]=this.value;this.closest('tr').lastElementChild.textContent=this.value===''?'':r2(this.value-${p.stock})"></td><td>${CNTV[p.id]!=null&&CNTV[p.id]!==''?r2(CNTV[p.id]-p.stock):''}</td></tr>`).join('')+'</table>'}
function saveCount(){const ch=Object.entries(CNTV).filter(([id,v])=>v!==''&&prod(id)&&+v!=prod(id).stock);
 if(!ch.length)return alert('ما في فروقات');if(!confirm('تسجيل '+ch.length+' فرق جرد؟'))return;
 ch.forEach(([id,v])=>{const p=prod(id);applyAdj(p,+v>p.stock?'زيادة جرد':'نقص جرد',r2(+v-p.stock),'جرد شامل')});
 for(const k in CNTV)delete CNTV[k];save();alert('تم حفظ الجرد ✔');go('stock')}
function saveAdj(){const p=prod($('#ap').value),q=+$('#aqn').value,t=$('#at').value;if(!p||!(q>0))return alert('اكتب الكمية');
 const delta=t=='زيادة جرد'?q:-q;if(delta<0&&-delta>p.stock)return alert('الكمية أكبر من المخزون');
 applyAdj(p,t,delta,$('#ant').value.trim());save();go('stock')}
function killLot(pid,b,exp){const p=prod(pid),l=(p.lots||[]).find(x=>(x.b||'')==b&&x.exp==exp);if(!l)return;
 if(!confirm('إتلاف '+l.q+' قطعة من '+pname(p)+' (صلاحية '+exp+')؟'))return;applyAdj(p,daysTo(exp)<0?'منتهي الصلاحية':'تالف',-l.q,'إتلاف دفعة '+(b||''),{b,exp});save();go('stock')}
function drawAdj(){const mo=$('#am').value,r=D.adj.filter(x=>x.d.slice(0,7)==mo).slice().reverse();
 $('#att').textContent='قيمة الخسائر (بالتكلفة): '+f2(sm(r,x=>-x.qty*x.cost))+' '+C;
 $('#al').innerHTML='<table><tr><th>التاريخ</th><th>المنتج</th><th>النوع</th><th>الكمية</th><th>القيمة</th><th>ملاحظة</th><th>بواسطة</th></tr>'+r.map(x=>`<tr><td>${x.d}</td><td>${esc(x.name)}</td><td>${esc(x.type)}</td><td class="${x.qty<0?'neg':'pos'}">${x.qty>0?'+':''}${x.qty}</td><td>${f2(x.qty*x.cost)}</td><td>${esc(x.note)}</td><td>${esc(x.by)}</td></tr>`).join('')+'</table>'}

V.rep=m=>{const t=ld();
 m.innerHTML=`<div class="card"><div class="f"><div><label>من</label><input type="date" id="ra" value="${t.slice(0,8)}01" onchange="drawRep()"></div><div><label>إلى</label><input type="date" id="rb" value="${t}" onchange="drawRep()"></div></div>
 <div class="row" style="margin-top:8px"><button class="b s" onclick="rq('d')">اليوم</button><button class="b s" onclick="rq('m')">هذا الشهر</button><button class="b s" onclick="rq('pm')">الشهر الماضي</button><button class="b s" onclick="rq('y')">هذه السنة</button>
 <button class="b" onclick="doPrint(shopHead()+$('#ro').innerHTML,true)">طباعة التقرير</button><button class="b s" onclick="xlsxExport('rep')">تصدير Excel</button></div></div><div id="ro"></div>`;drawRep()};
function rq(k){const d=new Date(),y=d.getFullYear(),m=d.getMonth();let a,b=ld();
 if(k=='d')a=b;else if(k=='m')a=ld(new Date(y,m,1));else if(k=='y')a=y+'-01-01';else{a=ld(new Date(y,m-1,1));b=ld(new Date(y,m,0))}
 $('#ra').value=a;$('#rb').value=b;drawRep()}
function repData(a,b){
 const f=x=>inR(x.d,a,b),ss=D.s.filter(f),ee=D.e.filter(f),yy=D.y.filter(f),uu=D.u.filter(f),rr=D.r.filter(f),aa=D.adj.filter(f);
 const sales=sm(ss,x=>x.total),gp=sm(ss,x=>x.profit),ret=sm(rr,x=>x.amt),retP=sm(rr,x=>x.amt-x.cost),ex=sm(ee,x=>x.amt),loss=sm(aa,x=>-x.qty*x.cost);
 const tp={};ss.forEach(s=>s.items.forEach(i=>{const o=tp[i.name]||(tp[i.name]={q:0,v:0,p:0});const q=i.qty-i.rq;o.q+=q;o.v+=i.price*q;o.p+=(i.price-i.cost)*q}));
 const cat={};ss.forEach(s=>s.items.forEach(i=>{const c=(prod(i.pid)||{}).cat||'بدون تصنيف';cat[c]=(cat[c]||0)+i.price*(i.qty-i.rq)}));
 const ec={};ee.forEach(e=>ec[e.cat]=(ec[e.cat]||0)+e.amt);
 const dy={};const g=d=>dy[d]||(dy[d]={n:0,v:0,p:0,e:0});ss.forEach(s=>{const o=g(s.d);o.n++;o.v+=s.total;o.p+=s.profit});rr.forEach(r=>{const o=g(r.d);o.v-=r.amt;o.p-=r.amt-r.cost});ee.forEach(e=>g(e.d).e+=e.amt);aa.forEach(x=>g(x.d).e+=-x.qty*x.cost);
 const sel={};ss.forEach(s=>{const k=s.by||'-';const o=sel[k]||(sel[k]={n:0,v:0});o.n++;o.v+=s.total});
 return{ms:methSum(ss,yy,rr),ss,sales,gp,ret,retP,ex,loss,net:gp-retP-ex-loss,disc:sm(ss,x=>x.disc),cash:sm(ss,x=>x.paid)+sm(yy,x=>x.amt)-sm(rr.filter(r=>r.refund=='cash'),r=>r.amt),
  debt:sm(ss,x=>x.due),col:sm(yy,x=>x.amt),pur:sm(uu,u=>u.qty*u.cost),top:Object.entries(tp).sort((x,y)=>y[1].v-x[1].v),cat,ec,dy,sel}}
function drawRep(){const a=$('#ra').value,b=$('#rb').value,x=repData(a,b),bx=(k,v,c)=>box(k,f2(v)+' '+C,c);
 const tb=(h,rows)=>`<table><tr>${h.map(t=>`<th>${t}</th>`).join('')}</tr>${rows.join('')||'<tr><td>لا يوجد</td></tr>'}</table>`;
 $('#ro').innerHTML=`<div class="card"><b>تقرير من ${a} إلى ${b}</b> <span class="k">(${x.ss.length} فاتورة)</span></div><div class="g">
 ${bx('المبيعات',x.sales)}${bx('المرتجعات',x.ret)}${bx('صافي المبيعات',x.sales-x.ret)}${bx('الخصومات',x.disc)}${bx('الربح الإجمالي',x.gp-x.retP)}
 ${bx('المصروفات',x.ex)}${bx('خسائر المخزون (تالف/عينات)',x.loss)}${bx('صافي الربح',x.net,x.net<0?'neg':'pos')}
 ${bx('المحصّل نقداً',x.ms.cash)}${bx('المحصّل ببطاقة مصرفية',x.ms.card)}${bx('المحصّل بحوالة مصرفية',x.ms.transfer)}${bx('إجمالي المحصّل',x.cash)}${bx('ديون جديدة',x.debt)}${bx('تسديدات الزبائن',x.col)}${bx('المشتريات (توريد)',x.pur)}</div>
 <div class="g2"><div class="card tw"><h3>المبيعات حسب التصنيف</h3>${tb(['التصنيف','المبيعات'],Object.entries(x.cat).sort((p,q)=>q[1]-p[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${f2(v)}</td></tr>`))}</div>
 <div class="card tw"><h3>المبيعات حسب البائع</h3>${tb(['البائع','الفواتير','المبيعات'],Object.entries(x.sel).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n}</td><td>${f2(v.v)}</td></tr>`))}</div></div>

  add('المشتريات',(D.u.length?D.u:[{}]).map(u=>({'التاريخ':u.d,'المنتج':u.name,'الكمية':u.qty,'التكلفة':u.cost,'الإجمالي':u.qty?r2(u.qty*u.cost):'','المدفوع':u.paid,'المورد':u.sup,'التشغيلة':u.b,'الصلاحية':u.exp})));

async function xlsxImport(el){
 const f=el.files[0];el.value='';if(!f)return;if(!need())return;
 try{await lib('xlsx')}catch(e){return alert(e.message)}
 const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
 const val=v=>v instanceof Date?ld(v):String(v??'').trim(),num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?null:n};
 let nw=0,up=0,sk=0;
 rows.forEach(rw=>{const g=k=>val(rw[k]);const name=g('الاسم');if(!name){sk++;return}
  const code=g('الباركود'),size=g('الحجم');
  let p=(code&&D.p.find(x=>(x.code||'')==code))||D.p.find(x=>x.name==name&&(x.size||'')==size);
  const o={name,size,en:g('الاسم بالإنجليزي'),cat:g('التصنيف'),code,hs:g('HS Code')};
  const nums={cost:num(rw['سعر التكلفة']),retail:num(rw['سعر القطاعي']),wholesale:num(rw['سعر الجملة']),stock:num(rw['الكمية']),wt:num(rw['الوزن كجم']),pc:num(rw['عدد بالكرتونة'])};
  if(code&&D.p.some(x=>x!==p&&(x.code||'')==code)){sk++;return}
  if(p){for(const k in o)if(o[k])p[k]=o[k];for(const k in nums)if(nums[k]!=null)p[k]=nums[k];normLots(p);up++}
  else{const ex=g('تاريخ الصلاحية'),st=nums.stock||0;p={id:D.i++,...o,cost:nums.cost||0,retail:nums.retail||0,wholesale:nums.wholesale||0,stock:st,wt:nums.wt||0,pc:nums.pc||0,lots:ex&&/^\d{4}-\d{2}-\d{2}$/.test(ex)&&st>0?[{b:'',exp:ex,q:st}]:[]};D.p.push(p);nw++}});
 log('استيراد Excel',nw+' جديد · '+up+' تحديث');save();alert(`تم الاستيراد ✔\nمنتجات جديدة: ${nw}\nتم تحديثها: ${up}${sk?'\nتم تخطي: '+sk+' (بدون اسم أو باركود مكرر)':''}`);go('prod')}

async function scan(cb){
 const ov=document.createElement('div');ov.className='ov';
 ov.innerHTML=`<div class="card sc"><h3>امسح الباركود</h3><div id="scv"></div><video id="scvid" playsinline muted hidden></video><p class="k" id="scm">جاري تشغيل الكاميرا…</p><button class="b s" id="scx">إغلاق</button></div>`;
 document.body.appendChild(ov);let done=false,stop=()=>{};
 const close=()=>{if(done)return;done=true;try{stop()}catch(e){}ov.remove()};
 ov.querySelector('#scx').onclick=close;ov.onclick=e=>{if(e.target===ov)close()};
 const hit=c=>{if(done)return;close();if(navigator.vibrate)navigator.vibrate(80);cb(String(c).trim())};
 try{
  if('BarcodeDetector' in window){
   const det=new BarcodeDetector(),v=ov.querySelector('#scvid'),st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
   stop=()=>st.getTracks().forEach(t=>t.stop());if(done)return stop();v.srcObject=st;v.hidden=false;await v.play();ov.querySelector('#scm').textContent='وجّه الكاميرا على الباركود';
   const loop=async()=>{if(done)return;try{const r=await det.detect(v);if(r.length)return hit(r[0].rawValue)}catch(e){}setTimeout(loop,150)};loop();
  }else{
   await lib('scan');if(done)return;const h=new Html5Qrcode('scv');stop=()=>{h.stop().catch(()=>{})};
   await h.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:150}},t=>hit(t));
   if(done)return stop();ov.querySelector('#scm').textContent='وجّه الكاميرا على الباركود';
  }
 }catch(e){const m=ov.querySelector('#scm');if(m)m.textContent='تعذّر تشغيل الكاميرا: '+(e&&e.name=='NotAllowedError'?'لم يتم السماح باستخدام الكاميرا':(e&&e.message)||e)}}

const BK=K+'_base';
const syBase=()=>{try{return JSON.parse(localStorage.getItem(BK)||'null')}catch(e){return null}};
const sySetBase=json=>{try{localStorage.setItem(BK,json)}catch(e){try{localStorage.removeItem(BK)}catch(_){}}};
const b64e=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function syKey(){
 const id=SY.code+'|'+SY.pass;if(SY_KEY&&SY_KEYID==id)return SY_KEY;
 const enc=new TextEncoder(),km=await crypto.subtle.importKey('raw',enc.encode(SY.pass),'PBKDF2',false,['deriveKey']);
 SY_KEY=await crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('store-sync|'+SY.code),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
 SY_KEYID=id;return SY_KEY}
async function syEnc(o){const iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await syKey(),new TextEncoder().encode(JSON.stringify(o))));return b64e(iv)+'.'+b64e(ct)}
async function syDec(s){const [a,b]=String(s).split('.');
 try{return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(a)},await syKey(),b64d(b))))}
 catch(e){throw new Error('كلمة سر المزامنة غير صحيحة')}}
const syRow=()=>sha256js('store-row|'+SY.code.trim().toLowerCase());
const syH=()=>{const h={apikey:SY.key,'Content-Type':'application/json'};if(/^eyJ/.test(SY.key))h.Authorization='Bearer '+SY.key;return h}; // المفاتيح الجديدة (sb_publishable_) تُرسل في apikey فقط
const syU=()=>SY.url.replace(/\/+$/,'')+'/rest/v1/store_sync';
async function syGet(){const r=await fetch(syU()+'?id=eq.'+syRow()+'&select=rev,data',{headers:syH()});if(!r.ok)throw new Error(await syErr(r));return (await r.json())[0]||null}
async function syErr(r){let t='';try{t=(await r.json()).message||''}catch(e){}return 'خطأ من السيرفر '+r.status+(t?': '+t:'')+(r.status==404?' (تأكد إنك سويت الجدول store_sync)':'')}
async function syPut(rev,base){ // يرفع D الحالية؛ يرجع true لو نجح
 const json=JSON.stringify(D),gen=SY_GEN,data=await syEnc(D),now_=new Date().toISOString();let ok;
 if(base==null){const r=await fetch(syU(),{method:'POST',headers:{...syH(),Prefer:'return=minimal'},body:JSON.stringify({id:syRow(),rev,data,updated_at:now_})});if(!r.ok)throw new Error(await syErr(r));ok=true}
 else{const r=await fetch(syU()+'?id=eq.'+syRow()+'&rev=eq.'+base,{method:'PATCH',headers:{...syH(),Prefer:'return=representation'},body:JSON.stringify({rev,data,updated_at:now_})});
  if(!r.ok)throw new Error(await syErr(r));ok=(await r.json()).length>0}
 if(ok){SY.base=rev;SY.dirty=SY_GEN!=gen;sySetBase(json)}return ok}
function syRender(){
 if(ME){const me=D.us.find(u=>u.id==ME.id&&u.h==ME.h);
  if(MGR){const mg=D.us.find(u=>u.id==MGR.id&&u.h==MGR.h&&u.role=='admin');if(mg)MGR=mg;else{MGR=null;SEC='sales';hdrUser()}}
  if(me){ME=me;if(!document.querySelector('.ov')&&!isTyping())setTimeout(()=>{try{go(tab)}catch(e){}},0)}
  else showLogin('تغيّرت بيانات الدخول من جهاز آخر، سجّل الدخول من جديد')}
 else if(!$('#ln'))showLogin()}
function syApply(x,rev){ // اعتماد نسخة السحابة كما هي
 SY_PAUSE=true;D=fix(x);save();SY_PAUSE=false;SY.base=rev;SY.dirty=false;SY.last=Date.now();sySave();sySetBase(JSON.stringify(D));syRender()}
const isTyping=()=>{const a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id!='q'||cart.length>0};

/* ===== دمج تعديلات جهازين (دمج ثلاثي حسب السجلات والحقول) ===== */
const REFS={s:[['cid','c'],['items.pid','p']],y:[['cid','c']],r:[['sid','s'],['cid','c'],['items.pid','p']],q:[['cid','c'],['sid','s'],['items.pid','p']],u:[['pid','p'],['supId','sup']],sp:[['supId','sup']],adj:[['pid','p']]};
const ADDK=new Set(['stock','q','rq']);
const jeq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const lkey=x=>x&&typeof x=='object'?('id' in x?'i'+x.id:(('b' in x||'exp' in x)&&'q' in x&&!('pid' in x))?'l'+(x.b||'')+'|'+(x.exp||''):null):null;
function m3(b,l,r,key){
 if(jeq(l,r))return l;if(b!==undefined&&jeq(l,b))return r;if(b!==undefined&&jeq(r,b))return l;
 if(typeof l=='number'&&typeof r=='number'&&typeof b=='number'&&ADDK.has(key))return r2(r+(l-b));
 if(Array.isArray(l)&&Array.isArray(r)){if([...l,...r].every(lkey))return mList(Array.isArray(b)?b:[],l,r,lkey);return l}
 if(l&&r&&typeof l=='object'&&typeof r=='object'){const o={},bb=b&&typeof b=='object'?b:{};
  for(const k of new Set([...Object.keys(l),...Object.keys(r)])){
   if(!(k in l)){if(k in bb&&jeq(bb[k],r[k]))continue;o[k]=r[k];continue}
   if(!(k in r)){if(k in bb&&jeq(bb[k],l[k]))continue;o[k]=l[k];continue}
   o[k]=m3(bb[k],l[k],r[k],k)}return o}
 return l}
function mList(b,l,r,kf){
 const B=new Map(b.map(x=>[kf(x),x])),Lm=new Map(l.map(x=>[kf(x),x])),R=new Map(r.map(x=>[kf(x),x])),out=[];
 for(const k of new Set([...R.keys(),...Lm.keys()])){const bx=B.get(k),lx=Lm.get(k),rx=R.get(k);
  if(lx&&rx)out.push(m3(bx,lx,rx));
  else if(lx){if(bx&&jeq(bx,lx))continue;out.push(lx)}   // انحذف في السحابة ولم يتغير هنا ← يُحذف
  else{if(bx&&jeq(bx,rx))continue;out.push(rx)}}        // انحذف هنا ولم يتغير في السحابة ← يُحذف
 return out}
function mergeData(B,L,R){
 L=JSON.parse(JSON.stringify(L));const map={};
 for(const k of Object.values(CNT)){ // سجلات جديدة على الجهازين بنفس الرقم ← نعطي سجلات هذا الجهاز أرقاماً جديدة
  const bi=new Set((B[k]||[]).map(x=>x.id)),ri=new Map((R[k]||[]).map(x=>[x.id,x]));
  let mx=Math.max(0,...(R[k]||[]).map(x=>+x.id||0),...(L[k]||[]).map(x=>+x.id||0));
  (L[k]||[]).forEach(x=>{if(!bi.has(x.id)&&ri.has(x.id)&&!jeq(ri.get(x.id),x)){(map[k]||(map[k]={}))[x.id]=++mx;x.id=mx}})}
 const rm=(col,v)=>map[col]&&map[col][v]!=null?map[col][v]:v;
 for(const k in REFS)(L[k]||[]).forEach(x=>REFS[k].forEach(([f,col])=>{if(f=='items.pid')(x.items||[]).forEach(i=>i.pid=rm(col,i.pid));else if(x[f]!=null)x[f]=rm(col,x[f])}));
 if(map.p)(L.c||[]).forEach(c=>{const o={};for(const k in c.prices||{})o[rm('p',+k)]=c.prices[k];c.prices=o});
 const out={};
 for(const k of COLS){
  if(k=='log'){const seen=new Set();out.log=[...(R.log||[]),...(L.log||[])].filter(x=>{const z=JSON.stringify(x);if(seen.has(z))return false;seen.add(z);return true}).sort((a,b)=>a.t.localeCompare(b.t)).slice(-3000);continue}
  out[k]=mList(B[k]||[],L[k]||[],R[k]||[],x=>'i'+x.id).sort((a,b)=>a.id-b.id)}
 out.set=m3(B.set||{},L.set||{},R.set||{},'set');
 const o=fix(out);o.p.forEach(p=>{if(p.stock<0)p.stock=0;normLots(p)});return o}

async function syncNow(manual){
 if(!syOn()||SY_BUSY)return;if(!navigator.onLine){syStat('☁ غير متصل','er');return}
 SY_BUSY=true;syStat('☁ جاري المزامنة…','wt');let msg='تمت المزامنة ✔';
 try{
  for(let tries=0;tries<5;tries++){
   const rm=await syGet();
   if(!rm){await syPut(1,null);break}
   if(rm.rev==SY.base){if(!SY.dirty||await syPut(rm.rev+1,rm.rev))break;continue}
   const x=await syDec(rm.data);
   if(!SY.dirty){syApply(x,rm.rev);break}
   const base=syBase();
   if(base){ // دمج تلقائي
    const mg=mergeData(base,D,x);const meId=ME&&ME.id,meH=ME&&ME.h;
    SY_PAUSE=true;D=mg;save();SY_PAUSE=false;
    if(await syPut(rm.rev+1,rm.rev)){syRender();msg='تم دمج تعديلات هذا الجهاز مع الأجهزة الأخرى ✔';break}
    continue}
   // بدون نسخة أساس (حالة نادرة): نسأل
   try{localStorage.setItem(K+'_conflict_'+ld(),JSON.stringify(D))}catch(e){}
   if(confirm('⚠ في تعديلات جديدة من جهاز آخر وتعديلات هنا.\n\nموافق = اعتماد نسخة السحابة (تعديلات هذا الجهاز تنحفظ نسخة احتياطية على الجهاز)\nإلغاء = رفع نسخة هذا الجهاز فوقها')){syApply(x,rm.rev);break}
   if(await syPut(rm.rev+1,rm.rev))break}
  SY.last=Date.now();SY.err='';sySave();syStat(SY.dirty?'☁ بانتظار الرفع':'☁ متزامن',SY.dirty?'wt':'ok');if(manual)alert(msg)}
 catch(e){SY.err=e.message||String(e);sySave();syStat('☁ خطأ بالمزامنة','er');if(manual)alert('تعذّرت المزامنة:\n'+SY.err)}
 finally{SY_BUSY=false;if(tab=='set'&&$('#syst'))$('#syst').innerHTML=syInfo();if(SY.dirty&&!SY_T)SY_T=setTimeout(()=>{SY_T=null;syncNow()},3000)}}
const syInfo=()=>syOn()?`الحالة: <b>${SY.err?'<span class="neg">'+esc(SY.err)+'</span>':SY.dirty?'بانتظار الرفع':'متزامن'}</b>${SY.last?' · آخر مزامنة: '+new Date(SY.last).toLocaleString('en-GB'):''} · نسخة رقم ${SY.base??'-'}`:'المزامنة غير مفعّلة على هذا الجهاز';

create policy "store_sync_rw" on store_sync

async function syEnable(fromLogin){
 const v=id=>$('#'+id).value.trim(),cfg={url:v('syu'),key:v('syk'),code:v('syc'),pass:$('#syp').value};
 if(!/^https:\/\/.+/.test(cfg.url)||!cfg.key||!cfg.code)return alert('اكتب الرابط والمفتاح ورمز المتجر');
 if(cfg.pass.length<8)return alert('كلمة سر المزامنة لازم 8 أحرف أو أكثر');
 if(!(window.crypto&&crypto.subtle))return alert('المزامنة تحتاج فتح البرنامج من رابط https (مثل GitHub Pages)');
 const old={...SY};Object.assign(SY,cfg,{on:true});SY_KEY=null;
 try{
  const rm=await syGet();
  if(!rm){if(!confirm('ما في بيانات في السحابة بهذا الرمز. رفع بيانات هذا الجهاز كنسخة أولى؟')){SY=old;return}
   await syPut(1,null)}
  else{const x=await syDec(rm.data),local=D.s.length||D.p.length||D.c.length;
   if(!local||confirm('في بيانات محفوظة في السحابة (منتجات: '+x.p.length+'، فواتير: '+x.s.length+').\n\nموافق = تحميلها على هذا الجهاز بدل بياناته الحالية\nإلغاء = رفع بيانات هذا الجهاز فوقها')){syApply(x,rm.rev)}
   else{await syPut(rm.rev+1,rm.rev)}}
  SY.last=Date.now();SY.err='';sySave();if(ME)log('تفعيل المزامنة'),save();syStat('☁ متزامن','ok');alert('تم تفعيل المزامنة ✔');
  if(fromLogin===true){document.querySelector('.ov')&&document.querySelector('.ov').remove();showLogin(D.us.length?'تم تحميل البيانات، سجّل الدخول':'')}else if(ME)go('set')}
 catch(e){SY=old;sySave();alert('تعذّر الاتصال:\n'+(e.message||e))}}
